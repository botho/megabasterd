name: Build MegaBasterd

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Rename jar-with-dependencies to MegaBasterd.jar
        run: |
          jar_path=$(find target -maxdepth 1 -name "*-jar-with-dependencies.jar" | head -n 1)
          cp "$jar_path" target/MegaBasterd.jar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaBasterd
          path: target/MegaBasterd.jar